<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Probabilistic Instrumental Learning Task</title>

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
  <script src="https://unpkg.com/hsluv@0.1.0/dist/hsluv.min.js"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" />

  <style>
    body { background: #f7f8fc; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .cue-grid {
      display: grid; grid-template-columns: repeat(3, 180px); gap: 20px;
      justify-content: center; margin: 18px 0;
    }
    .cue-slot-empty { width: 180px; min-height: 150px; }
    .cue {
      width: 180px; min-height: 150px; border-radius: 14px; border: 2px solid #333;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; padding: 10px;
    }
    .cue:hover { transform: translateY(-1px); }
    .identicon {
      width: 64px; height: 64px; border-radius: 10px; margin-bottom: 10px;
      border: 1px solid rgba(0,0,0,.15);
    }
    .pos-tag { font-size: 12px; color: #666; margin-top: 6px; }
    .big { font-size: 28px; font-weight: 700; margin: 10px 0; }
    .ok { color: #0f7a2d; } .bad { color: #b32424; }
    .small { color: #555; font-size: 14px; }
    input[type=range]{ width: 420px; }
  </style>
</head>
<body></body>
<script>
const CFG = {
  participant_id: 'P' + Math.random().toString(36).slice(2,10).toUpperCase(),
  conversion_rate_pence: 0.02, // 1 point = 0.02 pence

  learning_reps_per_set: 45, // 4*45=180
  transfer_reps_per_pair: 4, // 45*4=180
  rating_reps_per_cue: 4,    // 10*4=40

  choice_delay_ms: 500,
  feedback_ms: 1000,
  value_sd: 4,
  max_balance_attempts: 300
};

const CUES = Array.from({length:10}, (_,i)=>{
  const baseHue = 238 + (Math.random() * 10 - 5);
  const baseSat = 76 + (Math.random() * 4 - 2);
  const baseLight = 68 + (Math.random() * 6 - 3);
  return {
  id: `cue_${i+1}`,
  mu: [15,25,35,45,55,65,75,85,40,60][i],
  hue: baseHue,
  sat: baseSat,
  light: baseLight
  };
});

const LEARNING_SETS = [
  ["cue_1","cue_4"],
  ["cue_2","cue_5","cue_8"],
  ["cue_3","cue_6"],
  ["cue_7","cue_9","cue_10"]
];

const jsPsych = initJsPsych({
  on_finish: () => {
    jsPsych.data.get().localSave('csv', `task_${CFG.participant_id}.csv`);
  }
});
const SurveyHtmlFormPlugin =
  (typeof jsPsychSurveyHtmlForm !== "undefined" && jsPsychSurveyHtmlForm) ||
  null;

jsPsych.data.addProperties({
  participant_id: CFG.participant_id,
  conversion_rate_pence: CFG.conversion_rate_pence,
  started_at: new Date().toISOString()
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sampleNormal(mean, sd){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return mean + z*sd;
}
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function cueById(id){ return CUES.find(c=>c.id===id); }
function penceFromPoints(points){ return points * CFG.conversion_rate_pence; }
function seededRand(seed){
  let x = seed | 0;
  x ^= x << 13; x ^= x >> 17; x ^= x << 5;
  return ((x >>> 0) % 10000) / 10000;
}
function cueSeed(cue){
  return cue.id.split("").reduce((s,ch)=>s+ch.charCodeAt(0), 0);
}
function toHsluvHex(h,s,l){
  const hue = ((h%360)+360)%360;
  const sat = clamp(s,0,100);
  const light = clamp(l,0,100);
  if (typeof hsluv !== "undefined" && hsluv && typeof hsluv.hsluvToHex === "function"){
    return hsluv.hsluvToHex([hue, sat, light]);
  }
  return `hsl(${hue}, ${sat}%, ${light}%)`;
}

function identiconHTML(cue){
  const seed = cueSeed(cue);
  const c1 = toHsluvHex(cue.hue, cue.sat, cue.light);
  const c2 = toHsluvHex(cue.hue + 10, cue.sat - 3, cue.light - 6);
  let blocks = "";
  const cell = 12;
  for(let y=0;y<5;y++){
    for(let x=0;x<3;x++){
      const r = seededRand(seed + y*11 + x*37);
      if(r > 0.45){
        const fill = r > 0.7 ? c2 : c1;
        const rx = x*cell;
        const mx = (4-x)*cell;
        blocks += `<rect x="${rx}" y="${y*cell}" width="${cell}" height="${cell}" fill="${fill}" />`;
        if(mx !== rx) blocks += `<rect x="${mx}" y="${y*cell}" width="${cell}" height="${cell}" fill="${fill}" />`;
      }
    }
  }
  return `<div class="identicon"><svg viewBox="0 0 60 60" width="64" height="64" aria-hidden="true">
    <rect width="60" height="60" fill="#ffffff"/>${blocks}
  </svg></div>`;
}

function renderChoiceScreen({title, subtitle, cueSlots, showTrialText=""}){
  const htmlCues = cueSlots.map((cid)=>{
    if(!cid) return `<div class="cue-slot-empty"></div>`;
    const cue = cueById(cid);
    return `
      <button class="cue" data-cue="${cue.id}">
        ${identiconHTML(cue)}
      </button>
    `;
  }).join("");

  return `
    <div class="wrap">
      <h3>${title}</h3>
      <p>${subtitle}</p>
      <p class="small">${showTrialText}</p>
      <div class="cue-grid">${htmlCues}</div>
      <p class="small">请点击一个线索。</p>
    </div>
  `;
}

function makePositionAssignments(cueCount){
  if (cueCount === 2) return [[0,1],[1,0],[0,2],[2,0],[1,2],[2,1]];
  if (cueCount === 3) return [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  return [];
}
function buildBalancedDisplayTrials(trialSets){
  const appearance = {};
  trialSets.forEach(set=>set.forEach(cid=>appearance[cid]=(appearance[cid]||0)+1));
  for(let attempt=0; attempt<CFG.max_balance_attempts; attempt++){
    const orderedSets = shuffle(trialSets);
    const remain = {};
    Object.keys(appearance).forEach(cid=>{
      remain[cid] = [appearance[cid]/3, appearance[cid]/3, appearance[cid]/3];
    });
    const out = [];
    let ok = true;
    for(const set of orderedSets){
      const candidates = shuffle(makePositionAssignments(set.length));
      const picked = candidates.find(posArr=>set.every((cid,idx)=>remain[cid][posArr[idx]] > 0));
      if(!picked){ ok = false; break; }
      const slots = [null,null,null];
      set.forEach((cid,idx)=>{
        const pos = picked[idx];
        slots[pos] = cid;
        remain[cid][pos] -= 1;
      });
      out.push({set, slots});
    }
    if(ok) return out;
  }
  throw new Error(`无法生成平衡的位置分配（trials=${trialSets.length}）`);
}

function clickableCueTrial({phase, cueIds, cueSlots, trial_index, total_trials, withFeedback, scoreRef}){
  const stimulus = renderChoiceScreen({
    title: phase==="learning" ? "学习阶段" : "转移测试",
    subtitle: phase==="transfer"
      ? "请选择你认为平均价值更高的线索"
      : "请选择一个线索",
    cueSlots,
    showTrialText: `Trial ${trial_index}/${total_trials}`
  });
  let selectedCue = null;
  let startedAt = 0;
  let finished = false;

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus,
    choices: [],
    on_load: ()=>{
      startedAt = performance.now();
      document.querySelectorAll('.cue').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if (finished) return;
          finished = true;
          document.querySelectorAll('.cue').forEach(el=>el.style.pointerEvents = "none");
          selectedCue = btn.dataset.cue;
          jsPsych.finishTrial({choice: selectedCue, rt: Math.round(performance.now() - startedAt)});
        }, { once: true });
      });
    },
    data: {task:"choice", phase, trial_index, total_trials, cue_set: cueIds.join("|")},
    on_finish: (data)=>{
      const choice = data.choice;
      const options = cueIds.map(cueById);
      const bestMu = Math.max(...options.map(o=>o.mu));
      const chosenMu = cueById(choice).mu;
      const correct = chosenMu === bestMu ? 1 : 0;

      let outcome = null;
      if (withFeedback){
        outcome = Math.round(clamp(sampleNormal(chosenMu, CFG.value_sd), 0, 100));
        scoreRef.points += outcome;
      }

      data.choice = choice;
      data.correct = correct;
      data.chosen_mu = chosenMu;
      data.best_mu_in_set = bestMu;
      data.outcome_points = outcome;
      data.total_points_after = scoreRef.points;
    }
  };
}

function delayScreen(ms){
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="wrap"><p>请稍候...</p></div>`,
    choices: [],
    data: {task:"delay", delay_ms: ms},
    trial_duration: ms
  };
}

function feedbackScreen(scoreRef){
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: ()=>{
      const d = jsPsych.data.get().last(1).values()[0];
      const val = d.outcome_points ?? 0;
      return `
        <div class="wrap">
          <div class="big ${val>0?'ok':'bad'}">本次结果：${val} 分</div>
          <p>当前累计：<b>${scoreRef.points}</b> 分</p>
        </div>
      `;
    },
    choices: [],
    trial_duration: CFG.feedback_ms
  };
}

const timeline = [];
const SCORE = { points: 0 };

// 同意 + 说明（保留）
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="wrap">
    <h2>知情同意</h2>
    <p>你将参与一个在线决策任务。你的最终报酬将受到你在任务中选择的影响。</p>
    <p>若同意，请继续。</p>
  </div>`,
  choices: ["我同意并继续"]
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="wrap">
    <h2>任务说明</h2>
    <p>任务包含三个阶段：学习阶段、转移测试、显式评分。</p>
    <p>每次你会看到2或3个抽象线索，请点击其中一个。</p>
    <p>可能结果（points）范围是 <b>0 到 100</b>。</p>
    <p>学习阶段会显示结果；后两个阶段不显示结果，但你的选择将计入最终报酬。</p>
    <p>兑换率：<b>1 point = ${CFG.conversion_rate_pence} pence</b>。</p>
    <p>请尽量获得更高总分。</p>
  </div>`,
  choices: ["开始任务"]
});

// Learning 180
const learningSetsExpanded = [];
LEARNING_SETS.forEach(set=>{
  for(let i=0;i<CFG.learning_reps_per_set;i++) learningSetsExpanded.push(set);
});
buildBalancedDisplayTrials(learningSetsExpanded).forEach((trial,idx)=>{
  timeline.push(clickableCueTrial({
    phase:"learning",
    cueIds:trial.set,
    cueSlots:trial.slots,
    trial_index:idx+1,
    total_trials:learningSetsExpanded.length,
    withFeedback:true,
    scoreRef:SCORE
  }));
  timeline.push(delayScreen(CFG.choice_delay_ms));
  timeline.push(feedbackScreen(SCORE));
});

// Learning总结
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: ()=>{
    const p = SCORE.points;
    return `<div class="wrap">
      <h3>学习阶段结束</h3>
      <p>累计点数：<b>${p}</b></p>
      <p>折算金额：<b>${penceFromPoints(p).toFixed(2)} pence</b></p>
    </div>`;
  },
  choices:["继续"]
});

// Counterbalance
const orderTransferFirst = Math.random() < 0.5;
timeline.push({
  type: jsPsychCallFunction,
  func: ()=>jsPsych.data.write({task:"counterbalance", transfer_first:orderTransferFirst})
});

function buildTransferPhase(){
  const tl = [];
  tl.push({
    type: jsPsychHtmlButtonResponse,
    stimulus:`<div class="wrap">
      <h3>转移测试阶段（Transfer）</h3>
      <p>你将看到学习阶段出现过的线索两两组合（包含新组合）。</p>
      <p>请选出你认为平均价值更高的线索。本阶段不提供结果反馈。</p>
    </div>`,
    choices:["开始Transfer"]
  });

  const ids = CUES.map(c=>c.id);
  const pairs = [];
  for(let i=0;i<ids.length;i++){
    for(let j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);
  }
  const transferTrials = [];
  pairs.forEach(p=>{ for(let k=0;k<CFG.transfer_reps_per_pair;k++) transferTrials.push(p); });

  buildBalancedDisplayTrials(transferTrials).forEach((trial,idx)=>{
    tl.push(clickableCueTrial({
      phase:"transfer",
      cueIds:trial.set,
      cueSlots:trial.slots,
      trial_index:idx+1,
      total_trials:transferTrials.length,
      withFeedback:false,
      scoreRef:SCORE
    }));
    tl.push(delayScreen(CFG.choice_delay_ms));
  });
  return tl;
}

function buildRatingPhase(){
  const tl = [];
  tl.push({
    type: jsPsychHtmlButtonResponse,
    stimulus:`<div class="wrap">
      <h3>显式评分阶段（Explicit rating）</h3>
      <p>每次会看到一个线索。请估计它的平均价值（0-100）。</p>
      <p>本阶段不提供结果反馈。</p>
    </div>`,
    choices:["开始Rating"]
  });

  const ratingList = [];
  CUES.forEach(c=>{ for(let k=0;k<CFG.rating_reps_per_cue;k++) ratingList.push(c.id); });

  shuffle(ratingList).forEach((cid,idx)=>{
    const cue = cueById(cid);
    const preamble = `<div class="wrap">
        <p><b>Trial ${idx+1}/${ratingList.length}</b></p>
        <div class="cue-grid">
          <div class="cue-slot-empty"></div>
          <div class="cue" style="cursor:default">${identiconHTML(cue)}</div>
          <div class="cue-slot-empty"></div>
        </div>
        <p>你认为该线索的平均价值是多少（0-100）？</p>
      </div>`;
    const sliderHtml = `<p>
          <input type="range" name="rating" min="0" max="100" value="50">
          <span id="rv">50</span>
        </p>`;
    const trialData = {task:"rating", phase:"rating", cue_id:cid, trial_index:idx+1, total_trials:ratingList.length};
    if (SurveyHtmlFormPlugin){
      tl.push({
        type: SurveyHtmlFormPlugin,
        preamble,
        html: sliderHtml,
        button_label:"提交",
        data: trialData
      });
    } else {
      let capturedRating = "50";
      tl.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `${preamble}${sliderHtml}`,
        choices:["提交"],
        data: trialData,
        on_load: ()=>{
          const ratingInput = document.querySelector('input[name="rating"]');
          const ratingView = document.getElementById("rv");
          if (ratingInput){
            capturedRating = ratingInput.value;
            ratingInput.addEventListener("input", ()=>{
              capturedRating = ratingInput.value;
              if (ratingView) ratingView.textContent = capturedRating;
            });
          }
        },
        on_finish: (data)=>{
          data.response = {rating: capturedRating};
        }
      });
    }
  });

  return tl;
}

if(orderTransferFirst){
  timeline.push(...buildTransferPhase());
  timeline.push(...buildRatingPhase());
}else{
  timeline.push(...buildRatingPhase());
  timeline.push(...buildTransferPhase());
}

// 结束页（不显示完成码）
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: ()=>{
    const p = SCORE.points;
    return `<div class="wrap">
      <h2>任务结束，感谢参与！</h2>
      <p>最终点数：<b>${p}</b></p>
      <p>折算金额：<b>${penceFromPoints(p).toFixed(2)} pence</b></p>
    </div>`;
  },
  choices:["结束"]
});

jsPsych.run(timeline);
</script>
</html>
